# Fork-only helper: renders the real app on a demo library under a virtual
# display and uploads preview pictures of the projects list (v3.0.5 cover
# thumbnails). Nothing is signed, published or released.
name: List cover preview

on:
  workflow_dispatch:
  push:
    branches: [ 'release/v3.0.5-wavelab' ]

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libayatana-appindicator3-dev libnotify-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb fonts-dejavu-core
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          channel: 'stable'
      - run: flutter pub get
      - name: OAuth config (placeholders; no sign-in is used)
        run: cp lib/config/oauth_config.dart.template lib/config/oauth_config.dart
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter config --enable-linux-desktop
      - name: Render the preview
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            flutter test integration_test/screenshots/list_covers_preview_test.dart -d linux \
              --dart-define=DPM_DATA_DIR=daw_project_manager_screenshots \
              --dart-define=DPM_HIDE_VERSION=true \
              --dart-define=DPM_SCREENSHOTS=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: list-cover-preview
          path: build/preview_screenshots/
          if-no-files-found: warn
